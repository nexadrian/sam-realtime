[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-realtime"
version = "0.1.0"
description = "Realtime webcam segmentation experiments with SAM-family models."
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
onnx = [
  "onnxruntime>=1.17",
]
torch = [
  "torch>=2.3",
  "torchvision>=0.18",
]
fastsam = [
  "ultralytics>=8.3",
]
dev = [
  "pytest>=8",
]

[project.scripts]
sam-realtime = "sam_realtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
